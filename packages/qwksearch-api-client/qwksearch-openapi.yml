info:
  description: |
    Search, extract, vectorize and outline a topic base with AI Research Agent.
  version: 1.0.0
  title: QwkSearch API
  contact:
    name: QwkSearch
    email: support@qwksearch.com
  x-logo:
    url: "https://qwksearch.com/icons/qwksearch-logo.png"
    altText: logo
