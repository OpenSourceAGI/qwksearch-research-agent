<div class="thread">
  <div class="group/query"><h1 class="query-title">How do I reverse a list in Python?</h1></div>
  <div id="markdown-content-0" class="prose">
    <p>You can slice it with a negative step:</p>
    <pre><code class="language-python">reversed_list = my_list[::-1]</code></pre>
    <p>Other options:</p>
    <ul><li>Use <code>reversed()</code> for an iterator</li><li>Use <strong>sorted</strong> with <code>reverse=True</code></li></ul>
  </div>
  <div class="group/query"><h1>And in place?</h1></div>
  <div id="markdown-content-1" class="prose"><p>Use <code>my_list.reverse()</code>.</p></div>
</div>
