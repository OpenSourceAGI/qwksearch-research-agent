<div class="ChatMessagesView_infiniteScroll__abc">
  <div class="ChatMessage_chatMessage__x"><div class="Message_row__y Message_rightSideMessageRow__z"><div class="Message_rightSideMessageBubble__q"><div class="Message_selectableText__r">How do I reverse a list in Python?</div></div></div></div>
  <div class="ChatMessage_chatMessage__x"><div class="Message_row__y"><div class="Message_leftSideMessageBubble__w">
    <div class="Markdown_markdownContainer__u">
      <p>You can slice it with a negative step:</p>
      <pre><code class="language-python">reversed_list = my_list[::-1]</code></pre>
      <p>Other options:</p>
      <ul><li>Use <code>reversed()</code> for an iterator</li><li>Use <strong>sorted</strong> with <code>reverse=True</code></li></ul>
    </div>
  </div></div></div>
  <div class="ChatMessage_chatMessage__x"><div class="Message_rightSideMessageBubble__q"><div>And in place?</div></div></div>
  <div class="ChatMessage_chatMessage__x"><div class="Message_leftSideMessageBubble__w"><div class="Markdown_markdownContainer__u"><p>Use <code>my_list.reverse()</code>.</p></div></div></div>
