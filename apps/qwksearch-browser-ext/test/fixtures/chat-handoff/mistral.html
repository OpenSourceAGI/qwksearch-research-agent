<div class="thread">
  <div data-message-author-role="user"><p>How do I reverse a list in Python?</p></div>
  <div data-message-author-role="assistant">
    <p>You can slice it with a negative step:</p>
    <pre><code class="language-python">reversed_list = my_list[::-1]</code></pre>
    <p>Other options:</p>
    <ul><li>Use <code>reversed()</code> for an iterator</li><li>Use <strong>sorted</strong> with <code>reverse=True</code></li></ul>
  </div>
  <div data-message-author-role="user"><p>And in place?</p></div>
  <div data-message-author-role="assistant"><p>Use <code>my_list.reverse()</code>.</p></div>
</div>
