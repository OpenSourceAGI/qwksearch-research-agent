name: Test Reports

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Generate & Deploy Test Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # These are consumed by other workspace packages through their built
      # `dist` output; see the matching step in test-coverage.yml for why
      # this is explicit rather than a `prepare` script.
      - name: Build workspace libraries consumed via dist
        run: bunx turbo build --filter=extract-pdf --filter=extract-youtube --filter=react-reason-editor --filter=use-voice-control

      - name: Run tests with HTML reporter
        run: bun run test:report
        continue-on-error: true

      - name: Deploy to Cloudflare Workers
        working-directory: apps/test-reports
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/test-reports/dist/
          if-no-files-found: ignore
