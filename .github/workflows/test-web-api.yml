name: Test qwksearch-web

on:
  push:
    paths:
      - 'apps/qwksearch-web/**'
      - 'packages/agent-toolkit/**'
      - 'packages/extract-webpage/**'
      - '.github/workflows/test-qwksearch-web.yml'
  pull_request:
    paths:
      - 'apps/qwksearch-web/**'
      - 'packages/agent-toolkit/**'
      - 'packages/extract-webpage/**'
      - '.github/workflows/test-qwksearch-web.yml'

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        working-directory: apps/qwksearch-web
        run: bun run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/qwksearch-web/coverage/
          if-no-files-found: ignore
