name: Desktop Release

# Builds signed QwkSearch Desktop installers for macOS, Windows and Linux,
# publishes them as a GitHub release, and attaches the `latest.json` that
# installed apps poll (plugins.updater.endpoints in
# apps/qwksearch-desktop/src-tauri/tauri.conf.json).
#
# To ship an update: bump `version` in tauri.conf.json, then run this
# workflow from the Actions tab (or push a `desktop-v<version>` tag).
#
# The updater reads releases/latest, so the desktop release must stay the
# repo's newest non-prerelease release.
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, args: --target aarch64-apple-darwin, rust-targets: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, args: --target x86_64-apple-darwin, rust-targets: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-22.04, args: '', rust-targets: '' }
          - { name: Windows, os: windows-latest, args: '', rust-targets: '' }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/qwksearch-desktop/src-tauri -> target

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's strip chokes on newer system libraries.
          NO_STRIP: 'true'
        with:
          projectPath: apps/qwksearch-desktop
          # The package's own `tauri` script already appends `build`.
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: QwkSearch Desktop v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
