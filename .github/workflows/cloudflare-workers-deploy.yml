name: Build and deploy web and .com apps to Cloudflare Workers

on:
  # Deploy automatically for every push/commit to any branch.
  push:
    paths:
      - 'apps/**'
      - '.github/workflows/cloudflare-workers-deploy.yml'

  # Allows a manual deployment of one selected app.
  workflow_dispatch:
    inputs:
      app:
        description: 'Optional directory name under apps/. Leave empty to deploy every app that has a Wrangler config.'
        required: false
        type: string
      environment:
        description: 'Wrangler environment (production, staging, or leave blank for default).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Avoid two deployments from the same branch running at once.
  group: cloudflare-workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover deployable apps
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.select.outputs.apps }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select deployable apps
        id: select
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail

          # A directory is deployable when it carries a Wrangler config. The
          # name is no guide in either direction, and the old `grep -Ei
          # 'web|\.com'` filter got it wrong both ways across the repos this
          # workflow is copied into: `debate-web-ext` matched but is a browser
          # extension with no Worker, so `wrangler deploy` failed on it, while
          # `qwk-in-lobe` carries a wrangler.jsonc and was never deployed at
          # all.
          has_wrangler() {
            local dir="apps/$1"
            [[ -f "${dir}/wrangler.jsonc" || -f "${dir}/wrangler.json" || -f "${dir}/wrangler.toml" ]]
          }

          if [[ -n "${REQUESTED_APP}" ]]; then
            if [[ ! -d "apps/${REQUESTED_APP}" ]]; then
              echo "::error::Directory apps/${REQUESTED_APP} does not exist."
              exit 1
            fi

            if ! has_wrangler "${REQUESTED_APP}"; then
              echo "::error::apps/${REQUESTED_APP} has no wrangler.jsonc/.json/.toml, so it is not a Workers app."
              exit 1
            fi

            apps=$(jq -cn --arg app "${REQUESTED_APP}" '[ $app ]')
          else
            apps=$(
              for dir in apps/*/; do
                [[ -d "${dir}" ]] || continue
                app=$(basename "${dir}")
                if has_wrangler "${app}"; then echo "${app}"; fi
              done | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          fi

          # Not an error. This workflow is copied into repositories that have
          # no Workers app at all — GRAB-URL is one — and failing the run there
          # made it permanently red for a repository with nothing to deploy.
          # The deploy job is skipped instead.
          if [[ "${apps}" == "[]" ]]; then
            echo "No directory under apps/ carries a Wrangler config — nothing to deploy."
            find apps -mindepth 1 -maxdepth 1 -type d -printf ' - %f\n' 2>/dev/null || true
            echo "apps=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Deploying: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build and deploy ${{ matrix.app }}
    needs: discover
    # `fromJSON('[]')` is not an empty matrix to Actions, it is an error
    # ("Matrix vector 'app' does not contain any values"), so the job has to be
    # skipped before the matrix is evaluated.
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # bun, not npm: this repository is a bun workspace (`packageManager:
      # bun@1.4.0`, one `bun.lock` at the root) and `apps/qwksearch-web`
      # declares fifteen `workspace:*` dependencies. npm cannot parse that
      # protocol at all — the install died on
      # `EUNSUPPORTEDPROTOCOL: Unsupported URL Type "workspace:"` — so this job
      # has never deployed that app either, whatever the discovery step
      # selected.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Show app files
        run: |
          echo "Deploying app: ${{ matrix.app }}"
          echo "Current directory: $(pwd)"
          ls -la

      # Run from the app directory, not the repository root, because the two
      # deployable apps sit on opposite sides of the workspace boundary and
      # this one command covers both: `qwksearch-web` is in the root
      # `workspaces` globs, so bun walks up and installs the whole workspace
      # from `bun.lock`; `qwk-in-lobe` is not, so bun installs that package
      # alone. Verified both resolve (`bun install --dry-run`, exit 0) where
      # npm failed.
      #
      # No `--frozen-lockfile`: `qwk-in-lobe` has no entry in the root
      # `bun.lock` and no lockfile of its own, so a frozen install cannot
      # succeed there.
      - name: Install dependencies
        id: install
        run: bun install

      # `--if-present` has to precede the script name: after it, bun stops
      # parsing flags and forwards the rest to the script.
      - name: Build app
        if: steps.install.outcome == 'success'
        run: bun run --if-present build

      - name: Deploy Worker with Wrangler
        if: steps.install.outcome == 'success'
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [[ -n "${DEPLOY_ENV}" ]]; then
            bunx wrangler deploy --env "${DEPLOY_ENV}"
          else
            bunx wrangler deploy
          fi
