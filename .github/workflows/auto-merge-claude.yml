name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'claude[bot]' ||
      github.actor == 'anthropic-claude[bot]' ||
      github.actor == 'vtempest'
    steps:
      - name: Auto-approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (or merge directly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Preferred path: let GitHub merge once required checks pass.
          # Requires "Allow auto-merge" in repo settings + branch protection
          # with at least one required status check.
          if gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch; then
            echo "Auto-merge enabled for PR #$PR"
          else
            # Fallback for unprotected branches (no required checks):
            # merge immediately if the PR is mergeable.
            echo "Auto-merge unavailable, attempting direct merge"
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          fi